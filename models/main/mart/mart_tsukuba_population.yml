version: 2

models:
  - name: mart_tsukuba_population
    description: つくば市が公開する人口統計を全期間分統合したマートテーブル。基準日ごとに、地区、性別、年齢階級別の人口を収録し、市全体から地区単位までの人口推移を追える。
    access: public
    config:
      contract:
        enforced: true
    columns:
      - name: lg_code
        data_type: VARCHAR
        constraints:
          - type: not_null
      - name: area_code
        data_type: VARCHAR
        constraints:
          - type: not_null
      - name: lg_name
        data_type: VARCHAR
        constraints:
          - type: not_null
      - name: reference_date
        data_type: DATE
        constraints:
          - type: not_null
      - name: area_name
        data_type: VARCHAR
        constraints:
          - type: not_null
      - name: sex
        data_type: VARCHAR
        constraints:
          - type: not_null
      - name: age_group
        data_type: VARCHAR
        constraints:
          - type: not_null
      - name: population
        data_type: BIGINT
        constraints:
          - type: not_null
