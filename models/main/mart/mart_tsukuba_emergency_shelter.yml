version: 2

models:
  - name: mart_tsukuba_emergency_shelter
    description: つくば市の指定緊急避難場所を自治体標準オープンデータセット形式で提供するマートテーブル。各施設の名称・住所・緯度経度・標高・収容人数に加え、洪水・土砂災害・地震・津波など災害種別ごとの対応可否を収録する。
    access: public
    config:
      contract:
        enforced: true
    columns:
      - name: lg_code
        data_type: VARCHAR
        constraints:
          - type: not_null
      - name: shelter_id
        data_type: VARCHAR
        constraints:
          - type: not_null
      - name: name
        data_type: VARCHAR
        constraints:
          - type: not_null
      - name: name_kana
        data_type: VARCHAR
      - name: name_en
        data_type: VARCHAR
      - name: address
        data_type: VARCHAR
      - name: pref
        data_type: VARCHAR
      - name: city
        data_type: VARCHAR
      - name: town
        data_type: VARCHAR
      - name: addr_detail
        data_type: VARCHAR
      - name: building
        data_type: VARCHAR
      - name: latitude
        data_type: DOUBLE
      - name: longitude
        data_type: DOUBLE
      - name: elevation
        data_type: DOUBLE
      - name: phone
        data_type: VARCHAR
      - name: phone_ext
        data_type: VARCHAR
      - name: email
        data_type: VARCHAR
      - name: form_url
        data_type: VARCHAR
      - name: contact_note
        data_type: VARCHAR
      - name: postal_code
        data_type: VARCHAR
      - name: lg_name
        data_type: VARCHAR
      - name: flood
        data_type: BOOLEAN
      - name: landslide
        data_type: BOOLEAN
      - name: storm_surge
        data_type: BOOLEAN
      - name: earthquake
        data_type: BOOLEAN
      - name: tsunami
        data_type: BOOLEAN
      - name: large_fire
        data_type: BOOLEAN
      - name: inland_flooding
        data_type: BOOLEAN
      - name: volcanic
        data_type: BOOLEAN
      - name: duplicated_with_shelter
        data_type: VARCHAR
      - name: capacity
        data_type: BIGINT
      - name: target_areas
        data_type: VARCHAR
      - name: url
        data_type: VARCHAR
      - name: image_url
        data_type: VARCHAR
      - name: image_license
        data_type: VARCHAR
      - name: note
        data_type: VARCHAR
